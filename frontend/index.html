<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sentiment Dashboard</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
      :root{
        --bg-1:#ffffff; --bg-2:#f7fafc; --card:#ffffff;
        --accent:#0ea5b7; --positive:#10b981; --negative:#ef4444; --neutral:#64748b;
        --muted:#6b7280;
      }
      *{box-sizing:border-box}
      html,body{height:100%;margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,var(--bg-2),var(--bg-1));color:#0f1724}
      .app{max-width:1200px;margin:28px auto;padding:20px}
      header{display:flex;align-items:center;gap:20px;margin-bottom:18px}
      .brand{display:flex;flex-direction:column}
      .title{font-size:20px;font-weight:700;margin:0;color:#0b1220}
      .subtitle{font-size:13px;color:var(--muted);margin-top:4px}
      .controls{margin-left:auto;display:flex;gap:10px;align-items:center}
      .btn{background:#ffffff;border:1px solid #e6eef6;padding:8px 12px;border-radius:8px;color:var(--muted);cursor:pointer}
      .btn.ghost{background:transparent;border:1px solid #e6eef6;color:var(--muted)}

      .grid{display:grid;grid-template-columns:1fr 420px;gap:18px}
      .card{background:var(--card);border-radius:12px;padding:16px;border:1px solid #e6eef6;box-shadow:0 4px 14px rgba(15,23,36,0.04)}

      /* left column */
      .charts{display:flex;flex-direction:column;gap:14px}
      .charts .row{display:flex;gap:14px;align-items:flex-start}
      canvas{width:100%!important;height:260px!important}
      /* larger donut sizing and centering */
      .donut-wrap{width:340px;height:340px;display:flex;align-items:center;justify-content:center;margin:0 auto}
      #distChart{width:300px!important;height:300px!important;max-width:100%}

      /* per-post score bar */
      .post .score{font-size:12px;color:var(--muted)}
      .score-bar{height:10px;background:#f1f5f9;border-radius:6px;overflow:hidden;margin-top:6px}
      .score-fill{height:100%;border-radius:6px}

      /* right column */
      .sidebar{display:flex;flex-direction:column;gap:12px}
      #postsList{max-height:640px;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:10px}
      .post{background:linear-gradient(90deg, rgba(2,6,23,0.02), rgba(255,255,255,0.01));padding:12px;border-radius:10px;border:1px solid #f1f5f9;transition:transform .12s ease}
      .post.new{box-shadow:0 10px 24px rgba(2,6,23,0.06);transform:translateY(-4px)}
      .post .meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
      .post .text{margin-top:8px;color:#0f1724;font-size:13px}
      .sent-pill{padding:5px 10px;border-radius:999px;font-weight:600;font-size:12px}
      .sent-positive{background:rgba(16,185,129,0.08);color:var(--positive)}
      .sent-negative{background:rgba(239,68,68,0.08);color:var(--negative)}
      .sent-neutral{background:rgba(148,163,184,0.06);color:var(--neutral)}

      /* pills used in posts (match donut colors, larger) */
      .pill{display:inline-block;padding:8px 12px;border-radius:999px;font-weight:700;font-size:13px;text-transform:capitalize}
      .pill-positive{background:rgba(16,185,129,0.08);color:#065f46}
      .pill-negative{background:rgba(239,68,68,0.06);color:#7f1d1d}
      .pill-neutral{background:rgba(100,116,139,0.06);color:#334155}

      .filters{display:flex;gap:8px;align-items:center}
      select,input[type=search]{background:transparent;border:1px solid #e6eef6;padding:8px;border-radius:8px;color:#0f1724}

      footer{margin-top:18px;text-align:center;color:var(--muted);font-size:12px}

      @media (max-width:1000px){.grid{grid-template-columns:1fr}.sidebar{order:2}}
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div class="brand">
          <div class="title">Sentiment Dashboard</div>
          <div class="subtitle">Real-time sentiment & emotion monitoring</div>
        </div>
        <div class="controls">
          <div class="filters">
            <label style="font-size:12px;color:#9fb4c9;margin-right:6px">Filter</label>
            <select id="filterSelect">
              <option value="all">All</option>
              <option value="positive">Positive</option>
              <option value="neutral">Neutral</option>
              <option value="negative">Negative</option>
            </select>
            <label style="font-size:12px;color:#9fb4c9;margin-left:8px;margin-right:6px">Range</label>
            <select id="rangeSelect">
              <option value="24">24h</option>
              <option value="6">6h</option>
              <option value="1">1h</option>
            </select>
          </div>
          <button id="pauseBtn" class="btn">Pause</button>
          <button id="clearBtn" class="btn ghost">Clear</button>
          <button id="themeToggle" class="btn ghost" title="Toggle theme">Theme</button>
          <div id="connStatus" style="margin-left:10px;font-size:12px;color:#9fb4c9">Connecting...</div>
        </div>
      </header>

      <main class="grid">
        <section>
          <div class="charts">
            <div class="row">
              <div class="card" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center">
                <h4 style="margin:0 0 8px 0">Sentiment Distribution</h4>
                <div class="donut-wrap"><canvas id="distChart"></canvas></div>
              </div>
            </div>

            <div class="card">
              <h4 style="margin:0 0 8px 0">Sentiment Trend</h4>
              <canvas id="trendChart"></canvas>
            </div>
          </div>
        </section>

        <aside class="sidebar">
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div style="font-weight:600">Recent Posts</div>
              <input id="searchInput" type="search" placeholder="Search text" style="width:140px" />
            </div>
            <div id="postsList"></div>
          </div>
          <div class="card">
            <div style="font-weight:600;margin-bottom:8px">Metrics</div>
            <div id="metrics" style="display:flex;gap:8px;flex-wrap:wrap">
              <div style="min-width:80px"><div style="font-size:12px;color:#9fb4c9">Total</div><div id="total" style="font-weight:700">0</div></div>
              <div style="min-width:80px"><div style="font-size:12px;color:#9fb4c9">Positive</div><div id="positive" style="font-weight:700;color:#10b981">0</div></div>
              <div style="min-width:80px"><div style="font-size:12px;color:#9fb4c9">Negative</div><div id="negative" style="font-weight:700;color:#ef4444">0</div></div>
              <div style="min-width:80px"><div style="font-size:12px;color:#9fb4c9">Neutral</div><div id="neutral" style="font-weight:700;color:#94a3b8">0</div></div>
            </div>
            <div style="margin-top:8px;font-size:12px;color:#9fb4c9">Last update: <span id="lastUpdate">-</span></div>
          </div>
        </aside>
      </main>

      <footer>Live updates via WebSocket • Click a pie segment to filter posts</footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
      // CDN fallback: if Chart is not available, load local fallback script
      (function(){
        function ensureChart(){
          if(typeof Chart === 'undefined'){
            var s = document.createElement('script');
            s.src = '/chart.min.js';
            s.async = true;
            s.onload = function(){ console.log('Loaded local Chart fallback'); };
            s.onerror = function(){ console.warn('Local Chart fallback failed to load'); };
            document.head.appendChild(s);
          }
        }
        if(document.readyState === 'loading'){
          document.addEventListener('DOMContentLoaded', ensureChart);
        } else { ensureChart(); }
      })();
    </script>

    <script>
      /* Modernized UI logic: cleaner structure, last-updated, theme toggle, better controls */
      const state = {
        paused: false,
        filter: 'all',
        posts: [],
        counts: { positive: 0, negative: 0, neutral: 0, total: 0 },
        emotions: {},
      };

      const apiBase = (location.hostname === 'localhost') ? 'http://localhost:8000' : `${location.protocol}//${location.host}`;

      // utilities
      const esc = s => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"})[c]);
      function normSentiment(p){ return (p && (p.sentiment_label || (p.sentiment && p.sentiment.label) || p.label) || 'neutral').toString().toLowerCase(); }

      function makePostElement(p, highlight=false){
        const d = document.createElement('div'); d.className = 'post' + (highlight ? ' new' : '');
        d.innerHTML = `
          <div class="meta"><div class="source">${esc(p.source||p.author||'source')}</div><div class="time">${new Date(p.timestamp||p.created_at||Date.now()).toLocaleString()}</div></div>
          <div class="text">${esc(p.content||p.text||p.body||'')}</div>
          <div class="meta bottom"><div class="pill ${'pill-'+normSentiment(p)}">${normSentiment(p)}</div><div class="score">score: ${(p.score||p.sentiment_score||p.confidence||0).toFixed(2)}</div></div>
          <div class="score-bar"><div class="score-fill"></div></div>
        `;
        // set score fill width and color
        try{
          const raw = Number(p.score||p.sentiment_score||p.confidence||0) || 0;
          const v = Math.max(0, Math.min(1, raw));
          const fill = d.querySelector('.score-fill');
          if(fill){ fill.style.width = (v*100) + '%';
            const label = normSentiment(p);
            fill.style.background = label === 'positive' ? 'linear-gradient(90deg,#10b981,#34d399)' : label === 'negative' ? 'linear-gradient(90deg,#ef4444,#fca5a5)' : 'linear-gradient(90deg,#94a3b8,#c4b5fd)'; }
        }catch(e){/*ignore*/}
        return d;
      }

      // charts
      let distChart, trendChart;
      function initCharts(){
        const ctxD = document.getElementById('distChart').getContext('2d');
        distChart = new Chart(ctxD, {
          type: 'doughnut',
          data: { labels: ['Positive','Negative','Neutral'], datasets: [{ data: [0,0,0], backgroundColor: ['#10b981','#ef4444','#94a3b8'] }] },
          options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom', labels:{color:'#0f1724'}}} }
        });

        const ctxT = document.getElementById('trendChart').getContext('2d');
        trendChart = new Chart(ctxT, { type:'line', data:{ labels:[], datasets:[{label:'Positive',data:[], borderColor:'#10b981', tension:0.2, pointRadius:2},{label:'Negative',data:[], borderColor:'#ef4444', tension:0.2, pointRadius:2},{label:'Neutral',data:[], borderColor:'#94a3b8', tension:0.2, pointRadius:2}] }, options:{ responsive:true, interaction:{mode:'index', intersect:false}, plugins:{legend:{position:'bottom', labels:{color:'#0f1724'}}}, scales:{x:{ticks:{color:'#0f1724'}, grid:{color:'rgba(15,23,36,0.04)'}}, y:{ticks:{color:'#0f1724'}, grid:{color:'rgba(15,23,36,0.04)'}}} } });
      }

      function updateChartsFromState(){
        distChart.data.datasets[0].data = [state.counts.positive||0, state.counts.negative||0, state.counts.neutral||0];
        distChart.update();
        trendChart.update();
      }

      // data & rendering
      function renderPosts(){
        const container = document.getElementById('postsList'); container.innerHTML = '';
        const q = document.getElementById('searchInput').value.trim().toLowerCase();
        const filtered = state.posts.filter(p=>{
          const s = normSentiment(p);
          if(state.filter !== 'all' && s !== state.filter) return false;
          if(q && !( (p.content||p.text||'').toLowerCase().includes(q) )) return false;
          return true;
        });
        filtered.slice(0,200).forEach(p => container.appendChild(makePostElement(p)));
      }

      function renderMetrics(){
        document.getElementById('total').innerText = state.counts.total || 0;
        document.getElementById('positive').innerText = state.counts.positive || 0;
        document.getElementById('negative').innerText = state.counts.negative || 0;
        document.getElementById('neutral').innerText = state.counts.neutral || 0;
      }

      async function loadInitial(){
        try{
          const [postsRes, distRes, trendRes] = await Promise.all([
            fetch(apiBase + '/api/posts'),
            fetch(apiBase + '/api/sentiment/distribution?hours=24'),
            fetch(apiBase + '/api/sentiment/aggregate?period=hour')
          ]);
          if(postsRes.ok){ const j = await postsRes.json(); state.posts = (j.posts||j||[]).slice().reverse(); state.posts.forEach(p=>{ const s = normSentiment(p); state.counts[s] = (state.counts[s]||0)+1; state.counts.total = (state.counts.total||0)+1; }); }
          if(distRes.ok){ const j = await distRes.json(); const d = j.distribution||{}; state.counts.positive = d.positive||0; state.counts.negative = d.negative||0; state.counts.neutral = d.neutral||0; }
          if(trendRes.ok){ const j = await trendRes.json(); const arr = j.data||[]; trendChart.data.labels = arr.map(d=>new Date(d.timestamp).toLocaleTimeString()); trendChart.data.datasets[0].data = arr.map(d=>d.positive_count||0); trendChart.data.datasets[1].data = arr.map(d=>d.negative_count||0); trendChart.data.datasets[2].data = arr.map(d=>d.neutral_count||0); }
          updateChartsFromState(); renderMetrics(); renderPosts(); document.getElementById('lastUpdate').innerText = new Date().toLocaleString();
        }catch(e){ console.error('initial load', e); }
      }

      // websocket
      let ws, backoff = 1000;
      function startWS(){
        try{
          ws = new WebSocket((location.protocol==='https:'?'wss://':'ws://') + location.hostname + ':8000/ws/sentiment');
          ws.onopen = ()=>{ backoff = 1000; document.getElementById('connStatus').innerText = 'Connected'; };
          ws.onmessage = (ev)=>{ if(state.paused) return; try{ const msg = JSON.parse(ev.data); const payload = msg.data || msg.post || msg; const post = { content: payload.content || payload.text || payload.body, sentiment_label: payload.sentiment_label || (payload.sentiment && payload.sentiment.label), timestamp: payload.timestamp || payload.created_at, source: payload.source || payload.author, score: payload.score || payload.sentiment_score || payload.confidence }; state.posts.unshift(post); if(state.posts.length>1000) state.posts.pop(); const s = normSentiment(post); state.counts[s] = (state.counts[s]||0)+1; state.counts.total = (state.counts.total||0)+1; updateChartsFromState(); renderPosts(); renderMetrics(); document.getElementById('lastUpdate').innerText = new Date().toLocaleTimeString(); }catch(e){ console.error('ws parse', e); } };
          ws.onclose = ()=>{ document.getElementById('connStatus').innerText = 'Disconnected'; setTimeout(()=>{ backoff = Math.min(16000, backoff*2); startWS(); }, backoff); };
          ws.onerror = (e)=>{ console.error('ws error', e); ws.close(); };
        }catch(e){ console.error('startWS', e); }
      }

      // controls
      function attachControls(){
        document.getElementById('pauseBtn').addEventListener('click', ()=>{ state.paused = !state.paused; document.getElementById('pauseBtn').innerText = state.paused ? 'Resume' : 'Pause'; });
        document.getElementById('clearBtn').addEventListener('click', ()=>{ state.posts = []; document.getElementById('postsList').innerHTML = ''; state.counts = {positive:0,negative:0,neutral:0,total:0}; state.emotions = {}; updateChartsFromState(); renderMetrics(); });
        document.getElementById('filterSelect').addEventListener('change', (e)=>{ state.filter = e.target.value; renderPosts(); });
        document.getElementById('searchInput').addEventListener('input', ()=>renderPosts());
        document.getElementById('rangeSelect').addEventListener('change', ()=>{ loadInitial(); });
        document.getElementById('themeToggle').addEventListener('click', ()=>{ document.body.classList.toggle('light'); });
      }

      document.addEventListener('DOMContentLoaded', ()=>{
        // wait for Chart to be available
        const waitForChart = cb => { let tries=0; const iv = setInterval(()=>{ if(typeof Chart !== 'undefined' || ++tries>50){ clearInterval(iv); cb(); } }, 120); };
        waitForChart(()=>{ initCharts(); loadInitial(); startWS(); attachControls(); });
      });
    </script>
  </body>
</html>
